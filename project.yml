name: Yonk
options:
  bundleIdPrefix: com.jasonhwangfilm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 로컬 빌드는 ad-hoc 서명. 배포(P6)에서 Developer ID로 교체.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  Yonk:
    type: application
    platform: macOS
    sources:
      - path: Yonk
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Yonk/Info.plist
      properties:
        CFBundleDisplayName: Yonk
        CFBundleName: Yonk
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Jason Hwang"
        NSPrincipalClass: NSApplication
        CFBundleDevelopmentRegion: ko
        NSAppleEventsUsageDescription: "Finder에서 선택한 파일을 선반에 추가하기 위해 Finder와 통신합니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonhwangfilm.yonk
        PRODUCT_NAME: Yonk
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Yonk:
    build:
      targets:
        Yonk: all
    run:
      config: Debug
    archive:
      config: Release
